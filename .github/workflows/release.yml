name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tagged source and package recipes
        run: |
          bash ./scripts/release-publish-readiness.sh

      - name: Extract changelog
        run: |
          awk '/^## \['"${GITHUB_REF_NAME}"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md > release_notes.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to auscaster on Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: auscaster
          password: ${{ secrets.AUSCASTER_DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: image_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/auscaster/icey
            docker.io/auscaster/icey
          labels: |
            org.opencontainers.image.url=https://auscaster.com/icey
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build image once
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: ${{ steps.image_meta.outputs.labels }}

      - name: Verify and publish image
        run: |
          docker run --rm "ghcr.io/auscaster/icey:${GITHUB_REF_NAME}" sh -c \
            'test -d /usr/local/include && find /usr/local/lib -name libicy_base.a -type f | grep -q .'
          published_digest=""
          for image in ghcr.io/auscaster/icey docker.io/auscaster/icey; do
            docker push "${image}:${GITHUB_REF_NAME}"
            docker push "${image}:latest"
            version_digest="$(docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}" | awk '/^Digest:/ {print $2; exit}')"
            latest_digest="$(docker buildx imagetools inspect "${image}:latest" | awk '/^Digest:/ {print $2; exit}')"
            test -n "$version_digest"
            test "$version_digest" = "$latest_digest"
            if [[ -n "$published_digest" && "$published_digest" != "$version_digest" ]]; then
              echo "Registry manifests do not match for ${image}" >&2
              exit 1
            fi
            published_digest="$version_digest"
            echo "Verified ${image}:${GITHUB_REF_NAME} at ${version_digest}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: icey ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false

  publish-crates:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve unpublished Rust packages
        id: packages
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for directory in ('sys', 'icey'):
                  package = tomllib.loads((Path('packaging/crates') / directory / 'Cargo.toml').read_text())['package']
                  url = f"https://crates.io/api/v1/crates/{package['name']}/{package['version']}"
                  try:
                      with urlopen(Request(url, headers={'User-Agent': 'icey-release (https://auscaster.com/icey)'}), timeout=30):
                          publish = False
                  except HTTPError as error:
                      if error.code != 404:
                          raise
                      publish = True
                  print(f'{directory}={str(publish).lower()}', file=output)
          PY

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.packages.outputs.sys == 'true' || steps.packages.outputs.icey == 'true'

      - name: Install binding generator dependencies
        if: steps.packages.outputs.sys == 'true' || steps.packages.outputs.icey == 'true'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.packages.outputs.sys == 'true' || steps.packages.outputs.icey == 'true'
        id: auth

      - name: Publish icey-sys
        if: steps.packages.outputs.sys == 'true'
        run: cargo publish --locked --manifest-path packaging/crates/sys/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish icey
        if: steps.packages.outputs.icey == 'true'
        run: cargo publish --locked --manifest-path packaging/crates/icey/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
